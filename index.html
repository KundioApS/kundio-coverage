<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kundio Coverage</title>
    <style>
      :root {
        --bg-color: #050505;
        --card-bg: rgba(24, 24, 27, 0.65);
        --border-color: rgba(63, 63, 70, 0.4);
        --text-main: #f4f4f5;
        --text-muted: #a1a1aa;
        --accent: #6366f1;
        --accent-hover: #818cf8;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg-color);
        /* Subtle glowing orbs in the background */
        background-image:
          radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
          radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
        color: var(--text-main);
      }

      main {
        width: min(460px, calc(100vw - 48px));
        padding: 40px;
        border: 1px solid var(--border-color);
        border-radius: 24px;
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      .header {
        text-align: center;
        margin-bottom: 32px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        /* Metallic text gradient */
        background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p {
        margin: 0;
        color: var(--text-muted);
        font-size: 1.05rem;
        line-height: 1.5;
      }

      .links-grid {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 24px;
        border: 1px solid var(--border-color);
        border-radius: 16px;
        color: var(--text-main);
        text-decoration: none;
        background: rgba(9, 9, 11, 0.4);
        font-weight: 500;
        font-size: 1.1rem;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }

      a:hover {
        border-color: var(--accent);
        background: rgba(99, 102, 241, 0.08);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }

      /* Animated arrow icon using purely CSS */
      a::after {
        content: '→';
        font-size: 1.25rem;
        color: var(--text-muted);
        transition: all 0.25s ease;
      }

      a:hover::after {
        color: var(--accent-hover);
        transform: translateX(4px);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="header">
        <h1>Kundio Coverage</h1>
        <p>Generated Vitest coverage reports</p>
      </div>
      <div class="links-grid">
        <a href="./main/">Main Coverage</a>
        <a href="./staging/">Staging Coverage</a>
      </div>
    </main>
  </body>
</html>
